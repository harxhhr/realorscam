<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#121521">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07090E">
<title>Real or Scam?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Spot fake online stores before you pay. A short security awareness journey: quiz, lesson, checklist, quiz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Assistant:wght@400;600;700&family=Archivo+Black&family=DM+Serif+Display&display=swap">
<style>
/* World: a parcel's order-tracking page. The journey is tracked like a delivery; parcel-tape yellow marks where you are. */
:root{
  --ground:#EDF0F5; --paper:#FFFFFF; --paper-2:#F5F7FA; --ink:#121521; --ink-2:#3C4256; --rule:#CBD1DC;
  --band:#121521; --band-ink:#FFFFFF; --band-2:#B9C0CF;
  --tape:#FFC531; --tape-ink:#2A2000;
  --real:#1D4ED8; --real-soft:#E2EAFD; --real-deep:#18306F;
  --scam:#C2410C; --scam-soft:#FCE6DB; --scam-deep:#6E270A;
  --btn:#121521; --btn-ink:#FFFFFF; --off:#D3D8E1; --off-ink:#4A5065;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --sans:"Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0F121A; --paper:#181C27; --paper-2:#1F2431; --ink:#EEF1F7; --ink-2:#B0B7C8; --rule:#323949;
  --band:#07090E; --band-ink:#FFFFFF; --band-2:#9AA2B4;
  --tape:#FFC531; --tape-ink:#2A2000;
  --real:#86A8FF; --real-soft:#1B2A52; --real-deep:#D4E0FF;
  --scam:#FF9461; --scam-soft:#3F2216; --scam-deep:#FFD9C6;
  --btn:#EEF1F7; --btn-ink:#121521; --off:#2B3140; --off-ink:#A3AABB; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0F121A; --paper:#181C27; --paper-2:#1F2431; --ink:#EEF1F7; --ink-2:#B0B7C8; --rule:#323949;
  --band:#07090E; --band-ink:#FFFFFF; --band-2:#9AA2B4;
  --tape:#FFC531; --tape-ink:#2A2000;
  --real:#86A8FF; --real-soft:#1B2A52; --real-deep:#D4E0FF;
  --scam:#FF9461; --scam-soft:#3F2216; --scam-deep:#FFD9C6;
  --btn:#EEF1F7; --btn-ink:#121521; --off:#2B3140; --off-ink:#A3AABB; color-scheme:dark}

html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;scrollbar-color:var(--rule) transparent}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;caret-color:var(--real)}
::selection{background:var(--tape);color:var(--tape-ink)}
button,a,label{touch-action:manipulation}
button{font-family:inherit;user-select:none;-webkit-user-select:none;cursor:pointer}
a{color:var(--real);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--real);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-0.025em;line-height:1.08}
h1{font-size:clamp(34px,7.4vw,60px);font-weight:900}
h2{font-size:clamp(24px,4.6vw,34px);font-weight:800}
h3{font-size:20px;font-weight:800;letter-spacing:-0.01em}
p{margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

.band{background:var(--band);color:var(--band-ink)}
.band .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;letter-spacing:-0.02em;color:inherit;background:none;border:0;padding:0}
.brand .tape{width:12px;height:22px;background:var(--tape);border-radius:2px;transform:skewX(-14deg)}
.band small{font-size:13px;color:var(--band-2)}
main{padding-block:28px 64px}
.stack{display:flex;flex-direction:column;gap:28px}

/* Buttons */
.cta{min-height:54px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:var(--btn);color:var(--btn-ink);padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;transition:transform 160ms var(--ease-out), background-color 160ms ease}
.cta.tape{background:var(--tape);color:var(--tape-ink)}
.cta.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rule)}
.cta:disabled{background:var(--off);color:var(--off-ink);cursor:not-allowed;box-shadow:none}
.cta:active:not(:disabled),.opt:active{transform:scale(0.97)}
@media (hover:hover) and (pointer:fine){.cta.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink-2)} .opt:hover{border-color:var(--ink-2)}}
.opt{min-height:52px;border-radius:12px;font-size:15px;font-weight:600;background:var(--paper);color:var(--ink);border:2px solid var(--rule);padding:6px 12px;transition:transform 160ms var(--ease-out), background-color 160ms ease, border-color 160ms ease, color 160ms ease}
.opt.big{min-height:64px;font-size:18px;font-weight:800}
.opt[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.opt.real[aria-pressed="true"]{background:var(--real);border-color:var(--real);color:#fff}
.opt.scam[aria-pressed="true"]{background:var(--scam);border-color:var(--scam);color:#fff}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.muted{color:var(--ink-2)}
.small{font-size:14px}
input[type=text]{width:100%;box-sizing:border-box;min-height:50px;border-radius:12px;border:1.5px solid var(--rule);background:var(--paper-2);color:var(--ink);padding:0 14px;font:600 16px var(--mono);letter-spacing:.04em}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--ink-2);cursor:pointer}
.consent input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--real)}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;align-items:start}
.hero-copy{display:flex;flex-direction:column;gap:18px;max-width:640px}
.lede{font-size:18px;color:var(--ink-2);max-width:60ch}
.signup{background:var(--paper);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(18,21,33,.06), 0 12px 32px -18px rgba(18,21,33,.25)}
.signup .who{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:var(--paper-2);border-radius:12px;font-size:14px}
.signup .who b{font-family:var(--mono);letter-spacing:.04em}
.linkbtn{background:none;border:0;color:var(--real);font-weight:600;font-size:14px;padding:6px;text-decoration:underline;text-underline-offset:3px}

.track{background:var(--paper);border-radius:18px;padding:24px 24px 26px;display:flex;flex-direction:column;gap:22px}
.track-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.track-head .id{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.stops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:relative}
.stops::before{content:"";position:absolute;left:12.5%;right:12.5%;top:13px;height:4px;background:var(--rule);border-radius:4px}
.stops .fill{position:absolute;left:12.5%;top:13px;height:4px;background:var(--ink);border-radius:4px;width:calc(75% * var(--p, 0));transform-origin:left;animation:grow 900ms var(--ease-out) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 6px}
.dot{width:30px;height:30px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 3px var(--rule);display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.stop.done .dot{background:var(--ink);box-shadow:none}
.stop.next .dot{background:var(--tape);box-shadow:0 0 0 5px color-mix(in srgb, var(--tape) 35%, transparent)}
.stop > div{display:flex;flex-direction:column;gap:2px}
.stop b{font-size:15px;line-height:1.25}
.stop span{font-size:13px;color:var(--ink-2)}
.stop.next span{color:var(--ink);font-weight:600}

.score-block{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;align-items:center;background:var(--paper);border-radius:18px;padding:24px}
.score-num{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.score-num b{font-size:clamp(56px,9vw,84px);font-weight:900;letter-spacing:-0.05em;line-height:.9}
.score-num span{font-size:20px;font-weight:700;color:var(--ink-2)}
.meter{display:flex;flex-direction:column;gap:10px}
.meter-bar{position:relative;height:14px;border-radius:8px;display:grid;grid-template-columns:50fr 33fr 17fr;gap:3px}
.meter-bar i{display:block;border-radius:4px}
.meter-bar i:nth-child(1){background:color-mix(in srgb, var(--scam) 55%, var(--paper))}
.meter-bar i:nth-child(2){background:color-mix(in srgb, var(--tape) 80%, var(--paper))}
.meter-bar i:nth-child(3){background:color-mix(in srgb, var(--real) 60%, var(--paper))}
.pin{position:absolute;top:-7px;width:4px;height:28px;background:var(--ink);border-radius:2px;transform:translateX(-50%);box-shadow:0 0 0 2px var(--paper)}
.meter-labels{display:grid;grid-template-columns:50fr 33fr 17fr;font-size:13px;color:var(--ink-2)}
.meter-labels span:last-child{text-align:right}
.delta{font-weight:700}

.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.objectives{display:flex;flex-direction:column;gap:14px}
.objectives ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.objectives li{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--rule)}
.objectives li:last-child{border-bottom:1px solid var(--rule)}
.objectives svg{flex:none;margin-top:3px}
.challenge{background:var(--band);color:var(--band-ink);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px}
.challenge p{color:var(--band-2)}
.links{display:flex;flex-direction:column;gap:8px}
.links button{min-height:52px;border-radius:12px;background:#1E2333;color:#fff;border:1.5px solid #353C52;font:600 15px var(--mono);text-align:left;padding:0 16px;display:flex;align-items:center;gap:10px;transition:transform 160ms var(--ease-out), border-color 160ms ease}
.links button:active{transform:scale(0.98)}
.links button.right{border-color:#86A8FF;background:#1B2A52}
.links button.wrong{border-color:#FF9461;background:#3F2216}
.feedback{font-size:15px;color:#fff;background:#1E2333;border-radius:12px;padding:12px 14px}
.feedback b{color:var(--tape)}

/* Quiz */
.prog{display:flex;flex-direction:column;gap:10px}
.prog-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:700;color:var(--ink-2)}
.bar{height:6px;background:var(--off);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:999px;transform-origin:left;transition:transform 300ms var(--ease-out)}
.layout{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.phone-col{flex:1 1 320px;max-width:392px;min-width:0;margin:0 auto;display:flex;flex-direction:column;gap:8px;align-items:center}
.phone{width:100%;box-sizing:border-box;border:10px solid #0B0D14;border-radius:44px;background:#0B0D14;overflow:hidden;box-shadow:0 24px 48px -12px rgba(11,13,20,.35)}
.screen{height:min(720px, 74svh);overflow-y:auto;overscroll-behavior:contain;background:#fff;border-radius:34px;color:#000;caret-color:auto}
.screen.short{height:min(600px, 64svh)}
.phone-col .small{text-align:center}
.side{flex:1 1 360px;min-width:0;background:var(--paper);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:18px}
.banner{border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.banner.real{background:var(--real-soft);color:var(--real-deep)}
.banner.scam{background:var(--scam-soft);color:var(--scam-deep)}
.banner b{font-size:23px;letter-spacing:-0.02em;line-height:1.15}
.flags{display:flex;flex-direction:column;gap:10px}
.flag{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--rule)}
.flag:first-child{border-top:0;padding-top:0}
.flag .n{width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.n.real{background:var(--real)}.n.scam{background:var(--scam)}.n.tape{background:var(--tape);color:var(--tape-ink)}
.flag b{display:block;font-size:16px;line-height:1.3}
.flag .d{font-size:14.5px;color:var(--ink-2)}
.enter{animation:rise 240ms var(--ease-out)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Interstitial + final */
.center{max-width:680px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;background:var(--rule);border-radius:18px;overflow:hidden}
.compare > div{background:var(--paper);padding:20px;display:flex;flex-direction:column;gap:6px}
.compare b{font-size:52px;font-weight:900;letter-spacing:-0.04em;line-height:1;font-variant-numeric:tabular-nums}
.compare dl{margin:8px 0 0;display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;color:var(--ink-2)}
.compare dd{margin:0;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.code{white-space:pre-wrap;font-family:var(--mono);font-size:13.5px;background:var(--paper-2);border:1px dashed var(--rule);border-radius:10px;padding:12px;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.panel{background:var(--paper);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 180px}

/* Lesson */
.lesson-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pips{display:flex;gap:6px}
.pips i{width:28px;height:6px;border-radius:3px;background:var(--off)}
.pips i.on{background:var(--ink)}
.lesson{display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start}
.lesson .text{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:18px}
.takeaway{background:var(--tape);color:var(--tape-ink);border-radius:14px;padding:14px 16px;font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;padding:22px 0;border-top:1px solid var(--rule);align-items:center}
.steps li:last-child{border-bottom:1px solid var(--rule)}
.steps .how{display:flex;gap:14px;align-items:flex-start}
.mini{background:#fff;color:#111;border-radius:14px;padding:14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13.5px;line-height:1.4;box-shadow:0 1px 2px rgba(0,0,0,.08), 0 10px 24px -14px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:8px}
.mini .r{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #EEE;padding-top:8px}
.mini .r:first-of-type{border-top:0;padding-top:0}
.mini .hit{color:#B42318;font-weight:700}
.mini .ok{color:#15803D;font-weight:700}
.mini img{width:100%;height:110px;object-fit:cover;border-radius:10px}
.mini .lens{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.mini .lens img{height:48px;border-radius:6px}

/* Checklist */
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks li{border-top:1px solid var(--rule)}
.checks li:last-child{border-bottom:1px solid var(--rule)}
.checks button{width:100%;background:none;border:0;color:var(--ink);text-align:left;display:flex;gap:16px;align-items:flex-start;padding:16px 4px;font:inherit}
.box{width:28px;height:28px;border-radius:8px;box-shadow:inset 0 0 0 2px var(--rule);flex:none;display:flex;align-items:center;justify-content:center;transition:background-color 160ms ease, box-shadow 160ms ease}
.checks button[aria-pressed="true"] .box{background:var(--ink);box-shadow:none}
.checks button[aria-pressed="false"] .box svg{opacity:0}
.checks b{display:block;font-size:17px}
.checks span.d{color:var(--ink-2);font-size:15px}

@media (max-width:860px){
  .hero,.two-col,.score-block{grid-template-columns:1fr}
  .steps li{grid-template-columns:1fr;gap:12px}
}
@media (max-width:560px){
  .stops{grid-template-columns:1fr;gap:18px}
  .stops::before{left:14px;right:auto;top:15px;bottom:15px;width:4px;height:auto}
  .stops .fill{left:14px;top:15px;width:4px;height:calc((100% - 30px) * var(--p, 0));transform-origin:top;animation-name:growy}
  @keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .stop{flex-direction:row;text-align:left;align-items:center;gap:14px;padding:0}
  .stop > div{display:flex;flex-direction:column}
  .phone{border-width:7px;border-radius:34px}.screen{border-radius:27px;height:min(620px, 62svh)}.screen.short{height:min(560px, 58svh)}
  .side,.track,.score-block,.panel,.signup,.challenge{padding:18px}
}
@media (prefers-reduced-motion: reduce){
  .enter,.stops .fill{animation:none}
  .cta:active:not(:disabled),.opt:active{transform:none}
}

/* ---- phone screens: always a light, real-app look ---- */
.screen{--mk:#C2410C;--mk-tint:rgba(194,65,12,.12)}
.screen.is-real{--mk:#1D4ED8;--mk-tint:rgba(29,78,216,.12)}
.f{display:flex;align-items:flex-start;gap:6px;border-radius:8px;transition:background-color 200ms ease, box-shadow 200ms ease}
.f.is-marked{box-shadow:0 0 0 2.5px var(--mk);background-color:var(--mk-tint)}
.badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--mk);color:#fff;font:700 11px/1 var(--sans);flex:none;margin-top:1px}
.ig,.dm,.upi{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:18px;color:#000;background:#fff}
.ig-top{height:48px;display:flex;align-items:center;gap:14px;padding:6px 14px 0;position:sticky;top:0;background:#fff;z-index:2}
.ig-top b{font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ig-head{display:flex;align-items:center;gap:18px;padding:10px 16px 0}
.ring{width:88px;height:88px;border-radius:50%;padding:3px;box-sizing:border-box;background:linear-gradient(45deg,#FEDA75,#FA7E1E,#D62976,#962FBF,#4F5BD5);flex:none}
.ring img{width:100%;height:100%;border-radius:50%;border:3px solid #fff;box-sizing:border-box;object-fit:cover;display:block;background:#eee}
.ig-stats{flex:1;min-width:0;padding:4px}
.ig-stats .g{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.ig-stats .g div{display:flex;flex-direction:column}.ig-stats .g b{font-size:16px}.ig-stats .g span{font-size:13px}
.ig-bio{padding:10px 16px 0;display:flex;flex-direction:column;gap:1px}
.ig-bio .f{padding:1px 4px;margin-left:-4px}
.grey{color:#737373}.lnk{color:#00376B;font-weight:600}
.ig-btns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px;gap:6px;padding:14px 16px 0}
.ig-btns div{height:34px;border-radius:8px;background:#EFEFEF;font-weight:600;display:flex;align-items:center;justify-content:center}
.ig-btns .follow{background:#0095F6;color:#fff}
.ig-hl{display:flex;gap:14px;padding:16px 12px 4px;margin:0 4px;overflow-x:auto;align-items:center}
.ig-hl .h{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:66px;font-size:12px;text-align:center}
.ig-hl .c{width:64px;height:64px;border-radius:50%;border:1px solid #DBDBDB;padding:3px;box-sizing:border-box}
.ig-hl img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.ig-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid #DBDBDB;margin-top:8px}
.ig-tabs div{height:44px;display:flex;align-items:center;justify-content:center}.ig-tabs .on{border-bottom:1.5px solid #000}
.ig-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}

function summarize(round, ans) {
  const ok = a => a.choice === (a.real ? "real" : "scam");
  const scams = ans.filter(a => !a.real), reals = ans.filter(a => a.real);
  const r = { round, score: ans.filter(ok).length, total: ans.length, caught: scams.filter(a => a.choice === "scam").length, scamTotal: scams.length,
    falseFlag: reals.filter(a => a.choice === "scam").length, realTotal: reals.length, sureRight: ans.filter(a => a.sure && ok(a)).length,
    answers: ans.map(a => ({ id:a.id, real:a.real, choice:a.choice, sure:a.sure, correct:ok(a) })) };
  r.line = `STORE-${round.toUpperCase()} | ${P.code || "NOCODE"} | ${r.score}/${r.total} | caught ${r.caught}/${r.scamTotal} | falseflag ${r.falseFlag}/${r.realTotal} | sure+right ${r.sureRight} | ` + ans.map(a => (a.choice === "real" ? "R" : "S") + (a.sure ? "!" : "?")).join(" ");
  return r;
}
function send(r, statusId) {
  const st = () => document.getElementById(statusId);
  if (!SHEET_URL) { r.saved = "off"; return; }
  if (r.saved === "yes") return;
  fetch(SHEET_URL, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ session:P.session, code:P.code || "NOCODE" }, r)) })
    .then(() => { r.saved = "yes"; persist(); if (st()) st().textContent = "Your result was saved."; })
    .catch(() => { r.saved = "no"; persist(); if (st()) st().textContent = "Couldn't save automatically. Copy your result code and send it to the team."; });
}

  const zone = score == null ? null : score >= 83 ? "Hard to fool" : score >= 50 ? "Getting there" : "Easy target";
  const delta = P.pre && P.post ? pct(P.post) - pct(P.pre) : null;
  const pickedCls = (k) => !quick ? "" : k === "a" ? "right" : (k === quick ? "wrong" : "");

  app.innerHTML = `<div class="stack enter">
  <section class="hero">
    <div class="hero-copy">
      <h1>Would you spot a fake store before you pay?</h1>
      <p class="lede">Fake shops on Instagram, lookalike websites and DM sellers are built to look exactly like the real thing. In about 15 minutes you'll test your instincts, learn what scammers rely on, and test yourself again.</p>
    </div>
    <div class="signup" id="signup">
      ${needSignup ? `
        <h3>Before you start</h3>
        <label class="small" for="code" style="font-weight:700">Make up a secret code</label>
        <input id="code" type="text" maxlength="12" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="e.g. BLUE27" value="${esc(P.code)}">
        <p class="small muted">It links your before and after scores without your name. Letters and numbers only.</p>
        <label class="consent" for="consent"><input id="consent" type="checkbox" ${P.consent ? "checked" : ""}><span>I agree to take part. My answers are saved anonymously (no name or email), used only for a class project, and I can stop at any time.</span></label>
        <button type="button" class="cta tape" data-a="go" ${P.consent ? "" : "disabled"}>${ctaLabel}${ic.arrow}</button>`
      : `
        <h3>${step === "done" ? "You've finished the journey" : "Pick up where you left off"}</h3>
        <div class="who"><span>Your code</span><b>${esc(P.code || "NOCODE")}</b></div>
        <button type="button" class="cta tape" data-a="go">${ctaLabel}${ic.arrow}</button>
        <button type="button" class="linkbtn" data-a="reset">Start over with a new code</button>`}
    </div>
  </section>

  <section class="track" aria-labelledby="trk">
    <div class="track-head"><h2 id="trk" style="font-size:24px">Your progress</h2><span class="id">${doneCount} of 4 steps done</span></div>
    <div class="stops" role="list" style="--p:${progress}">
      <span class="fill" aria-hidden="true"></span>
      ${stops.map(s => { const done = s.k === "pre" ? P.pre : s.k === "lesson" ? P.lesson : s.k === "checklist" ? P.checklist : P.post;
        const cls = done ? "done" : (s.k === step ? "next" : "");
        return `<div role="listitem" class="stop ${cls}"><span class="dot">${done ? ic.tick("#fff") : ""}</span><div><b>${s.t}</b><span>${cls === "next" ? "Up next · " : ""}${s.d}</span></div></div>`; }).join("")}
    </div>
  </section>

  <section class="score-block" aria-labelledby="sc">
    <div style="display:flex;flex-direction:column;gap:8px">
      <h2 id="sc" style="font-size:24px">Safety score</h2>
      ${score == null ? `<p class="muted">Take the before quiz to get your first score.</p>`
        : `<div class="score-num"><b>${score}</b><span>/ 100</span></div><p><b>${zone}.</b> <span class="muted">Based on your ${P.post ? "after" : "before"} quiz.</span>${delta != null ? ` <span class="delta" style="color:${delta >= 0 ? "var(--real)" : "var(--scam)"}">${delta >= 0 ? "+" : ""}${delta} since the before quiz.</span>` : ""}</p>`}
    </div>
    <div class="meter" aria-hidden="true">
      <div class="meter-bar"><i></i><i></i><i></i>${score == null ? "" : `<span class="pin" style="left:${Math.max(1, Math.min(99, score))}%"></span>`}</div>
      <div class="meter-labels"><span>Easy target</span><span>Getting there</span><span>Hard to fool</span></div>
    </div>
  </section>

  <section class="two-col">
    <div class="objectives">
      <h2 style="font-size:24px">By the end, you'll be able to</h2>
      <ul>
        <li>${ic.tick("var(--ink)")}<span>Tell a real small seller from a scam on Instagram, a website or in DMs.</span></li>
        <li>${ic.tick("var(--ink)")}<span>Name the red flags scammers rely on: impossible prices, fake urgency, prepaid only, new or renamed accounts, fake reviews, missing business details.</span></li>
        <li>${ic.tick("var(--ink)")}<span>Check any store in about 2 minutes with free tools on your phone.</span></li>
        <li>${ic.tick("var(--ink)")}<span>Pay safely: read the UPI banking name and prefer cash on delivery or a payment link.</span></li>
      </ul>
    </div>
    <div class="challenge">
      <h2 style="font-size:24px">Quick challenge</h2>
      <p>You found handmade blue pottery on Instagram. The bio links to three sites. Which one is most likely the real store?</p>
      <div class="links">
        <button type="button" data-q="a" class="${pickedCls("a")}">bluepotteryjaipur.in</button>
        <button type="button" data-q="b" class="${pickedCls("b")}">bluepottery-jaipur-outlet.shop</button>
        <button type="button" data-q="c" class="${pickedCls("c")}">bluepotteryjaipur.in.sale-today.xyz</button>
      </div>
      ${quick ? `<div class="feedback" role="status">${quick === "a" ? "<b>Right.</b> " : "<b>Not quite.</b> "}The first one is a plain brand-name domain. "-outlet.shop" is a cheap throwaway lookalike, and in the last one the real site is <i>sale-today.xyz</i>: everything before it is just decoration. Always read a web address from the right.</div>` : ""}
    </div>
  </section>
</div>`;

  const code = document.getElementById("code");
  if (code) code.addEventListener("input", e => { P.code = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12); if (e.target.value !== P.code) e.target.value = P.code; persist(); });
  const cons = document.getElementById("consent");
  if (cons) cons.addEventListener("change", e => { P.consent = e.target.checked; persist(); app.querySelector('[data-a="go"]').disabled = !P.consent; });
}

function quizScreen() {
  const total = deck().length;
  app.innerHTML = `<div class="stack">
  <div class="prog"><div class="prog-row"><span>Store ${Q.i + 1} of ${total}</span><span>${Q.round === "pre" ? "Before quiz" : "After quiz"}</span></div><div class="bar" aria-hidden="true"><i style="transform:scaleX(${Q.i / total})"></i></div></div>
  <div class="layout enter">
    <div class="phone-col"><div class="phone"><div id="screen" class="screen" tabindex="0" aria-label="Store preview, scrollable"></div></div><span class="small muted">Scroll inside the phone to see the whole page</span></div>
    <div class="side" id="side"></div>
  </div></div>`;
  renderPhone(false); renderPanel();
}
function renderPhone(keep) {
  const scr = document.getElementById("screen"); if (!scr) return;
  const y = keep ? scr.scrollTop : 0, c = card();
  MARKS = Q.revealed;
  scr.className = "screen" + (c.real ? " is-real" : "");
  scr.innerHTML = c.type === "insta" ? insta(c) : c.type === "web" ? web(c) : chat(c);
  scr.scrollTop = y;
}
function renderPanel() {
  const side = document.getElementById("side"); if (!side) return;
  const c = card(), t = TYPE[c.type], pre = Q.round === "pre", last = Q.i === deck().length - 1;
  const answered = Q.choice !== null && Q.sure !== null;
  let label = last ? (pre ? "Finish the before quiz" : "See my results") : "Next store";
  if (!pre && !Q.revealed) label = "Check my answer";
  const disabled = !Q.revealed && !answered;
  let html;
  if (!Q.revealed) {
    html = `<h2>${t.q}</h2>
    <div class="two"><button type="button" class="opt big real" data-a="real" aria-pressed="${Q.choice === "real"}">${t.real}</button><button type="button" class="opt big scam" data-a="scam" aria-pressed="${Q.choice === "scam"}">${t.scam}</button></div>
    <span style="font-weight:700">How sure are you?</span>
    <div class="two"><button type="button" class="opt" data-a="sure" aria-pressed="${Q.sure === true}">Pretty sure</button><button type="button" class="opt" data-a="guess" aria-pressed="${Q.sure === false}">Just guessing</button></div>
    ${pre ? `<p class="small muted">Answers stay hidden in this round. You'll learn what to look for next.</p>` : ""}`;
  } else {
    const right = Q.choice === (c.real ? "real" : "scam"), k = c.real ? "real" : "scam";
    html = `<div class="banner ${k} enter"><span style="font-weight:700">${right ? "You got it." : "Not this time."}</span><b>${c.real ? t.vr : t.vs}</b><span class="small">${esc(c.summary)}</span></div>
    <h3>${c.real ? "Signs it's legit" : "Red flags"}, marked on the phone</h3>
    <div class="flags">${c.flags.map((f, n) => `<div class="flag"><span class="n ${k}">${n + 1}</span><div><b>${esc(f[0])}</b><span class="d">${esc(f[1])}</span></div></div>`).join("")}</div>`;
  }
  side.innerHTML = html + `<button type="button" class="cta" data-a="next" ${disabled ? "disabled" : ""}>${label}</button>`;
}

function preDoneScreen() {
  const r = P.pre;
  app.innerHTML = `<div class="center enter">
  <h1>Before quiz done: ${r.score} of ${r.total}</h1>
  <p class="lede">We're keeping the answers to ourselves for now. Next, a 5-part lesson on how fake stores work and how to check one, then a short checklist. After that you'll get 6 new stores.</p>
  <div class="panel"><span style="font-weight:700">Your result code</span><div class="code" id="line">${esc(r.line)}</div><p class="small muted" id="save-status" role="status">${SHEET_URL ? "Saving your result…" : "Keep this code. It's also saved on this device."}</p></div>
  <div class="row"><button type="button" class="cta tape" data-a="lesson">Start the lesson${ic.arrow}</button><button type="button" class="cta ghost" data-a="home">Back to dashboard</button></div>
</div>`;
  send(r, "save-status");
}

function lessonScreen() {
  const L = LESSONS[lessonIdx], k = L.real ? "real" : "scam", last = lessonIdx === LESSONS.length - 1;
  const pips = LESSONS.map((_, i) => `<i class="${i <= lessonIdx ? "on" : ""}"></i>`).join("");
  let body;
  if (L.steps) {
    body = `<div class="text" style="flex-basis:100%">
      <ol class="steps">
        <li><div class="how"><span class="n tape" style="width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none">1</span><div><b style="font-size:18px;display:block">Check the account's history</b><span class="muted">On the Instagram profile, tap ⋯ then <i>About this account</i>. Look at the join date and former usernames.</span></div></div>
          <div class="mini"><b>About this account</b><div class="r"><span>Date joined</span><span class="hit">October 2026</span></div><div class="r"><span>Former usernames</span><span class="hit">4</span></div></div></li>
        <li><div class="how"><span class="n tape" style="width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none">2</span><div><b style="font-size:18px;display:block">Reverse-search a product photo</b><span class="muted">Long-press the photo, choose <i>Search with Google Lens</i>. The same photo on dozens of other stores means it was copied.</span></div></div>
          <div class="mini"><img src="${I("hoodie")}" alt=""><b>Visual matches · 40+ sites</b><div class="lens"><img src="${I("hoodie")}" alt=""><img src="${I("hoodie")}" alt="" style="object-position:30% 20%"><img src="${I("hoodie")}" alt="" style="transform:scaleX(-1)"><img src="${I("hoodie")}" alt="" style="object-position:70% 60%"></div></div></li>
        <li><div class="how"><span class="n tape" style="width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none">3</span><div><b style="font-size:18px;display:block">Look up the website's age</b><span class="muted">Search the domain on any WHOIS lookup site. A store that's days or weeks old, selling at 90% off, is a scam.</span></div></div>
          <div class="mini"><b>WHOIS · urbanthreadz-sale.shop</b><div class="r"><span>Created</span><span class="hit">9 days ago</span></div><div class="r"><span>Registrant</span><span>Redacted for privacy</span></div></div></li>
        <li><div class="how"><span class="n tape" style="width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none">4</span><div><b style="font-size:18px;display:block">Verify the GST number</b><span class="muted">Copy the GSTIN from the website and search it on the GST portal (services.gst.gov.in). The legal name should match the store.</span></div></div>
          <div class="mini"><b>GSTIN search result</b><div class="r"><span>Status</span><span class="ok">Active</span></div><div class="r"><span>Legal name</span><span>Ghar Kitchenware LLP</span></div></div></li>
      </ol>
      <p class="takeaway">${esc(L.take)}</p></div>`;
  } else {
    MARKS = true;
    body = `<div class="phone-col"><div class="phone"><div class="screen short ${L.real ? "is-real" : ""}" tabindex="0" aria-label="Example, scrollable">${L.phone()}</div></div><span class="small muted">Scroll the phone to find each number</span></div>
    <div class="text">
      <div class="flags">${L.points.map((p, i) => `<div class="flag"><span class="n ${k}">${i + 1}</span><div><b>${esc(p[0])}</b><span class="d">${esc(p[1])}</span></div></div>`).join("")}</div>
      <p class="takeaway">${esc(L.take)}</p>
    </div>`;
    MARKS = false;
  }
  app.innerHTML = `<div class="stack enter">
  <div class="lesson-head"><div class="pips" aria-label="Lesson ${lessonIdx + 1} of ${LESSONS.length}">${pips}</div><span class="small muted">Lesson ${lessonIdx + 1} of ${LESSONS.length}</span></div>
  <div style="display:flex;flex-direction:column;gap:10px;max-width:760px"><h1 style="font-size:clamp(30px,5.6vw,46px)">${esc(L.title)}</h1><p class="lede">${esc(L.intro)}</p></div>
  <div class="lesson">${body}</div>
  <div class="row" style="max-width:640px">${lessonIdx > 0 ? `<button type="button" class="cta ghost" data-a="lprev">Previous</button>` : `<button type="button" class="cta ghost" data-a="home">Dashboard</button>`}
    <button type="button" class="cta ${last ? "tape" : ""}" data-a="lnext">${last ? "Go to the checklist" : "Next lesson"}${ic.arrow}</button></div>
</div>`;
}

function checklistScreen() {
  const n = P.checks.filter(Boolean).length, all = n === CHECKS.length;
  app.innerHTML = `<div class="center enter">
  <h1>Your online shopping checklist</h1>
  <p class="lede">Before you pay a store you haven't used before, run through these. Tick each one you'll do from now on.</p>
  <ul class="checks">${CHECKS.map((c, i) => `<li><button type="button" data-c="${i}" aria-pressed="${!!P.checks[i]}"><span class="box">${ic.tick("var(--btn-ink)")}</span><span><b>${esc(c[0])}</b><span class="d">${esc(c[1])}</span></span></button></li>`).join("")}</ul>
  <p class="small muted">Scammed or unsure? Report it at cybercrime.gov.in or call 1930.</p>
  <div class="row"><button type="button" class="cta tape" data-a="post" ${all ? "" : "disabled"}>${all ? "Take the after quiz" : `Tick all 7 to continue (${n}/7)`}${all ? ic.arrow : ""}</button></div>
</div>`;
}

function finalScreen() {
  const a = P.pre, b = P.post, sa = pct(a), sb = pct(b), d = sb - sa;
  const zone = sb >= 83 ? "Hard to fool" : sb >= 50 ? "Getting there" : "Easy target";
  app.innerHTML = `<div class="center enter">
  <h1>${d > 0 ? `You improved by ${d} points` : d === 0 ? "Same score, sharper eye" : "Worth another look"}</h1>
  <p class="lede">Your safety score is now <b style="color:var(--ink)">${sb} / 100: ${zone}.</b> ${d > 0 ? "You caught more of the tricks scammers rely on." : "Go back over the lesson and the red flags you missed."}</p>
  <div class="compare">
    <div><span class="muted">Before</span><b>${a.score}/${a.total}</b><dl><dt>Scams caught</dt><dd>${a.caught}/${a.scamTotal}</dd><dt>Real stores called scams</dt><dd>${a.falseFlag}/${a.realTotal}</dd><dt>Sure and right</dt><dd>${a.sureRight}</dd></dl></div>
    <div><span class="muted">After</span><b>${b.score}/${b.total}</b><dl><dt>Scams caught</dt><dd>${b.caught}/${b.scamTotal}</dd><dt>Real stores called scams</dt><dd>${b.falseFlag}/${b.realTotal}</dd><dt>Sure and right</dt><dd>${b.sureRight}</dd></dl></div>
  </div>
  <div class="panel"><span style="font-weight:700">Your result codes</span><div class="code" id="line">${esc(a.line)}\n${esc(b.line)}</div>
    <p class="small muted" id="save-status" role="status">${SHEET_URL ? "Saving your result…" : "Keep these codes and send them to the team running the session."}</p>
    <button type="button" class="cta ghost" data-a="copy">Copy codes</button></div>
  <div class="row"><button type="button" class="cta" data-a="home">Back to dashboard</button></div>
</div>`;
  send(b, "save-status");
}

function render() {
  ({ home: homeScreen, quiz: quizScreen, predone: preDoneScreen, lesson: lessonScreen, checklist: checklistScreen, final: finalScreen })[view]();
}
function startQuiz(round) { Object.assign(Q, { round, i:0, choice:null, sure:null, revealed:false, ans:[] }); view = "quiz"; render(); toTop(); }
function go() {
  const s = nextStep();
  if (s === "pre" || s === "post") return startQuiz(s);
  if (s === "lesson") { lessonIdx = 0; view = "lesson"; }
  else if (s === "checklist") view = "checklist";
  else view = "final";
  render(); toTop();
}

document.addEventListener("click", async (e) => {
  const q = e.target.closest("[data-q]");
  if (q) { quick = q.dataset.q; homeScreen(); app.firstElementChild.classList.remove("enter"); const f = app.querySelector(".fill"); if (f) f.style.animation = "none"; return; }
  const c = e.target.closest("[data-c]");
  if (c) { const i = +c.dataset.c; P.checks[i] = !P.checks[i]; persist(); checklistScreen(); const btn = app.querySelector(`[data-c="${i}"]`); if (btn) btn.focus(); return; }
  const b = e.target.closest("[data-a]"); if (!b || b.disabled) return;
  const a = b.dataset.a;
  if (a === "home") { view = "home"; render(); toTop(); return; }
  if (a === "go") { if (nextStep() === "pre" && !P.consent) return; go(); return; }
  if (a === "reset") { const keep = P.consent; P = fresh(); P.consent = false; persist(); quick = null; view = "home"; render(); toTop(); return; }
  if (a === "real" || a === "scam") { Q.choice = a; renderPanel(); return; }
  if (a === "sure" || a === "guess") { Q.sure = a === "sure"; renderPanel(); return; }
  if (a === "next") {
    const cd = card();
    if (!Q.revealed) {
      Q.ans.push({ id:cd.id, real:cd.real, choice:Q.choice, sure:Q.sure });
      if (Q.round === "post") { Q.revealed = true; renderPhone(true); renderPanel(); return; }
    }
    Q.revealed = false; Q.choice = null; Q.sure = null;
    if (Q.i < deck().length - 1) { Q.i++; quizScreen(); toTop(); return; }
    const r = summarize(Q.round, Q.ans);
    if (Q.round === "pre") { P.pre = r; persist(); view = "predone"; } else { P.post = r; persist(); view = "final"; }
    render(); toTop(); return;
  }
  if (a === "lesson") { lessonIdx = 0; view = "lesson"; render(); toTop(); return; }
  if (a === "lprev") { lessonIdx = Math.max(0, lessonIdx - 1); render(); toTop(); return; }
  if (a === "lnext") {
    if (lessonIdx < LESSONS.length - 1) { lessonIdx++; render(); toTop(); return; }
    P.lesson = true; persist(); view = "checklist"; render(); toTop(); return;
  }
  if (a === "post") { if (P.checks.filter(Boolean).length < CHECKS.length) return; P.checklist = true; persist(); startQuiz("post"); return; }
  if (a === "copy") {
    const txt = document.getElementById("line").textContent;
    try { await navigator.clipboard.writeText(txt); b.textContent = "Copied"; }
    catch (err) { const r = document.createRange(); r.selectNodeContents(document.getElementById("line")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected, now copy it"; }
  }
});

render();
</script>

</body>
</html>
